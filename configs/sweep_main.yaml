# Step 3.1 -- frozen confirmatory sweep grid.
#
# This is the grid PREREGISTRATION.md sec 6 requires to be frozen before any
# confirmatory run: "Any run whose config hash differs from the recorded one
# is exploratory by construction." configs/default.json is a leftover
# placeholder (PREREGISTRATION.md sec 6) and is NOT this config.
#
# Do not edit this file after data collection starts without a dated
# PREREGISTRATION.md sec 8 amendment. This step (Step 3.1) only freezes the
# grid and estimates its runtime -- it does not run the sweep.

# Matrix shape for every cell: (m=64, n) @ (n, k=64). Small, fixed output
# dimensions; only the contraction length n varies. Convention reused
# unchanged from scripts/probe_n_scaling.py and scripts/measure_u_eff.py
# (Steps 2.3 / u_eff groundwork), which already use (m=64, n) @ (n, k=64)
# and TENSOR_SHAPE=(64, 1024) respectively -- not a new shape choice.
matrix_shape:
  m: 64
  k: 64
  # n is swept below (main_grid.n / reference_configs.n), not fixed here.

# accum is fixed at "exact" for this sweep -- it is the study's primary route
# (isolates input-quantization error from accumulation error; see
# qgemm.gemm's module docstring and SPEC.md). accum="bf16" is a separate
# ablation, out of scope for this grid per the project's own cut-line policy.
accum: exact

# element_format is fixed at e2m1 -- the only element format qgemm.blocks
# supports, and both real formats (MXFP4, NVFP4) store E2M1 elements
# (SPEC.md: "element_format is E2M1 in every configuration").
element_format: e2m1

# ---------------------------------------------------------------------------
# use_global_scale is NOT an independent grid factor -- it is a derived field,
# not a sixth dimension. It is fully determined by scale_format, matching the
# MXFP4/NVFP4 presets in blocks.py exactly:
#
#   e8m0 -> use_global_scale = false   (MXFP4-style: E8M0 spans 255 binades
#                                        and reaches any block's magnitude
#                                        unaided)
#   e4m3 -> use_global_scale = true    (NVFP4-style: E4M3 spans ~19 binades
#                                        and overflows to NaN without a
#                                        global scale -- see blocks.py,
#                                        "Why the global scale exists")
#
# Config generation (scripts/run_sweep.py) reads this as a lookup keyed by
# scale_format. With it kept out of the factorial, the grid is
#   8 (nu) x 5 (n) x 4 (block_size) x 2 (scale_format) x 2 (round_mode)
#     x 2 (rht) = 1280 cells,
# not 2560.
use_global_scale_by_scale_format:
  e8m0: false
  e4m3: true

# ---------------------------------------------------------------------------
# The main factorial grid. Exactly the six factors below; do not add or
# remove any.
main_grid:
  nu: [1, 2, 3, 5, 8, 15, 30, "gaussian"]        # t-Student df; "gaussian" = nu -> infinity
  n: [16, 64, 256, 1024, 4096]                   # contraction dimension
  block_size: [8, 16, 32, 64]
  scale_format: [e8m0, e4m3]
  round_mode: [rtne, sr]
  rht: [false, true]                             # per-block only; see transforms.py --
                                                  # a global (whole-row) RHT is out of
                                                  # scope by design, not merely unimplemented

# ---------------------------------------------------------------------------
# Adaptive trial budget -- NOT uniform across nu.
#
# nu in {1, 2, 3}: the heaviest tails. This is where quantile estimates --
# especially p99 -- are noisiest (SPEC.md's u_eff and metric-stability
# diagnostics both found the heavy-tail cells to be the hardest to pin down
# statistically), and it is where the theoretical bound
# cota(n) = c * u_eff / sqrt(n) is most likely to break (H1's entire premise
# is that fragility differs at heavy tails). Under-sampling here would save
# the least useful compute and risk the noisiest possible read on the
# question the whole sweep exists to answer, so these cells get 5000
# trials/cell -- 5x the rest of the grid.
#
# nu in {5, 8, 15, 30, gaussian}: lighter tails. u_eff's own stability check
# (SPEC.md, "Sample size, and why p99 is trustworthy here") found quantiles
# well-behaved at far smaller budgets once tails are no longer extreme, so
# these cells get 1000 trials/cell -- the same budget scripts/probe_n_scaling.py
# and scripts/check_metric_stability.py already used as a "cheap probe" default.
trial_budget:
  heavy_tail_nu: [1, 2, 3]
  heavy_tail_trials: 5000
  light_tail_nu: [5, 8, 15, 30, "gaussian"]
  light_tail_trials: 1000

# ---------------------------------------------------------------------------
# Reference configs -- OUTSIDE the 1280-cell factorial grid, for
# context/comparison only. FP8-E4M3 per-tensor, FP8-E5M2 per-tensor and
# INT8 per-tensor (qgemm.formats.int8_quantize, Step 2.2). These are
# per-tensor formats: one scale for the whole operand, not block scaling, so
# they have no block_size / scale_format / use_global_scale / rht dimension
# -- adding any of those would misrepresent what a per-tensor format is.
#
# Swept across the same nu grid and the same adaptive trial budget as the
# main grid, but only at a representative subset of n, not all five:
# n = [16, 256, 4096]. This reuses scripts/check_metric_stability.py's own
# (nu, n) grid choice unchanged (its GRID_N is exactly {16, 256, 4096}) rather
# than picking a new one -- 16 is the highest-risk corner for a per-tensor
# denominator (fewest terms, heaviest tails at once, per that diagnostic's own
# finding), 4096 is the main grid's ceiling, and 256 is a middle anchor. These
# are context baselines, not part of the P1/P2/P3 confirmatory comparisons
# (PREREGISTRATION.md sec 4, sec 7 item 5 -- FP8's role there is still open),
# so their own n-dependence is not the question this subset needs to resolve.
reference_configs:
  formats: [fp8_e4m3_per_tensor, fp8_e5m2_per_tensor, int8_per_tensor]
  nu: [1, 2, 3, 5, 8, 15, 30, "gaussian"]
  n: [16, 256, 4096]
