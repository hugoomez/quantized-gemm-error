[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantized-gemm-error"
version = "0.1.0"
description = "Numerical research into quantized GEMM error behavior"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "nanaysonic" }]

# Core dependencies. Torch is intentionally excluded here -- it is only
# needed (CPU-only) starting Phase 4.4 and will be added as an explicit
# extra at that point, not bundled into the default install.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "ml_dtypes>=0.3",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "pytest>=7.4",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Lint tooling isn't part of the numerical/dependency list the project
# cares about reproducing exactly, so it's kept separate from the core
# pinned set in requirements.lock.
dev = ["ruff>=0.5"]

# CPU-only torch, plus transformers and datasets, for Step 4.4 (real GPT-2
# activation extraction over WikiText-2 -- see SPEC.md, "Step 4.4"). Kept out
# of the default install, per README.md's "not bundled" note: torch's
# CPU-only wheel is not what a plain `pip install -e ".[activations]"` would
# resolve from PyPI's default index, so it needs installing separately first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install -e ".[activations]"
# Verify afterwards that `torch.cuda.is_available()` is False (this project's
# CPU-only discipline, same as every other dependency here).
activations = [
    "torch>=2.10",
    "transformers>=5.10",
    "datasets>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qgemm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises a real subprocess kill/resume; skips itself if it can't hit the timing window.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
